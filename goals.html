<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FITCARE - Log Food</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* MOBILE CONTAINER */
        .mobile-container {
            width: 100%;
            max-width: 428px;
            height: 100vh;
            max-height: 926px;
            background-color: #000;
            position: relative;
            overflow: hidden;
            border: 1px solid #333;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 255, 0, 0.15);
            display: flex;
            flex-direction: column;
        }

        /* === SIDE NAVIGATION === */
        .side-nav {
            position: absolute;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #000;
            border-right: 1px solid #00ff00;
            z-index: 1000;
            transition: left 0.25s cubic-bezier(0.4, 0.0, 0.2, 1);
            box-shadow: 5px 0 30px rgba(0, 255, 0, 0.2);
            display: flex;
            flex-direction: column;
            border-radius: 24px 0 0 24px;
            overflow: hidden;
        }

        .side-nav.open {
            left: 0;
        }

        .nav-header {
            padding: 20px 16px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-header h2 {
            color: #00ff00;
            font-size: 1.4em;
            font-weight: 700;
        }

        .close-nav {
            background: rgba(0, 255, 0, 0.1);
            border: none;
            color: #00ff00;
            font-size: 1.3em;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .nav-profile {
            padding: 20px 16px;
            border-bottom: 1px solid #333;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff00, #00cc00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #000;
        }

        .profile-text h3 {
            color: #fff;
            font-size: 1.1em;
            margin-bottom: 2px;
        }

        .profile-text p {
            color: #888;
            font-size: 0.85em;
        }

        .nav-menu {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
            -webkit-overflow-scrolling: touch;
        }

        .nav-item-side {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            color: #ddd;
            text-decoration: none;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-item-side.active {
            background: rgba(0, 255, 0, 0.08);
            color: #00ff00;
            border-left-color: #00ff00;
        }

        .nav-item-side:active {
            background: rgba(0, 255, 0, 0.15);
            transform: scale(0.98);
        }

        .nav-icon-side {
            font-size: 1.2em;
            width: 24px;
        }

        .nav-label {
            font-size: 0.95em;
        }

        .nav-footer {
            padding: 20px 16px;
            border-top: 1px solid #333;
        }

        .logout-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 12px;
            color: #ff4444;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
        }

        .logout-btn:active {
            background: rgba(255, 0, 0, 0.2);
            transform: scale(0.98);
        }

        /* OVERLAY */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease;
            backdrop-filter: blur(3px);
            border-radius: 24px;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* SWIPE INDICATOR */
        .swipe-indicator {
            position: absolute;
            top: 50%;
            left: 10px;
            width: 4px;
            height: 40px;
            background: rgba(0, 255, 0, 0.5);
            border-radius: 2px;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1001;
        }

        .swipe-indicator.visible {
            opacity: 1;
        }

        /* STATUS BAR */
        .status-bar {
            padding: 12px 16px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            color: #00ff00;
            background: #000;
            z-index: 10;
            flex-shrink: 0;
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
        }

        .menu-toggle {
            background: rgba(0, 255, 0, 0.1);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: #00ff00;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .menu-toggle:active {
            background: rgba(0, 255, 0, 0.2);
            transform: scale(0.95);
        }

        .time {
            font-weight: 600;
            font-size: 1em;
        }

        .status-icons {
            display: flex;
            gap: 8px;
            font-size: 1em;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            padding: 15px 16px;
            background: #000;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
            flex-shrink: 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: #00ff00;
            font-size: 1.5em;
            cursor: pointer;
            padding: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .back-btn:active {
            background: rgba(0, 255, 0, 0.1);
        }

        .header h1 {
            font-size: 1.5em;
            color: #00ff00;
            flex: 1;
        }

        /* CONTENT */
        .content {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* SEARCH SECTION */
        .search-section {
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px 45px 15px 45px;
            background-color: #0a0a0a;
            border: 2px solid rgba(0, 255, 0, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2em;
            color: #00ff00;
        }

        .clear-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            font-size: 1.2em;
            cursor: pointer;
            display: none;
        }

        .clear-btn.visible {
            display: block;
        }

        /* MEAL TYPE SELECTOR */
        .meal-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .meal-selector::-webkit-scrollbar {
            height: 0;
        }

        .meal-btn {
            padding: 10px 20px;
            background-color: #0a0a0a;
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 20px;
            color: #fff;
            font-size: 0.9em;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .meal-btn.active {
            background-color: #00ff00;
            color: #000;
            border-color: #00ff00;
            font-weight: bold;
        }

        /* FOOD LIST */
        .food-list {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.1em;
            color: #00ff00;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .food-item {
            background-color: #0a0a0a;
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .food-item:active {
            transform: scale(0.98);
            border-color: #00ff00;
        }

        .food-info {
            flex: 1;
        }

        .food-name {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 1em;
        }

        .food-nutrients {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: #888;
        }

        .nutrient {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .add-btn {
            background-color: #00ff00;
            color: #000;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        .add-btn:active {
            transform: scale(0.9);
        }

        /* TODAY'S LOG */
        .todays-log {
            background-color: #0a0a0a;
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .log-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #00ff00;
        }

        .total-calories {
            font-size: 1.5em;
            font-weight: bold;
            color: #00ff00;
        }

        .logged-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logged-item:last-child {
            border-bottom: none;
        }

        .logged-info {
            flex: 1;
        }

        .logged-name {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .logged-meal {
            font-size: 0.85em;
            color: #666;
        }

        .logged-nutrients {
            display: flex;
            gap: 10px;
            font-size: 0.85em;
            color: #888;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ff3333;
            font-size: 1.3em;
            cursor: pointer;
            padding: 5px;
        }

        .empty-log {
            text-align: center;
            color: #666;
            padding: 20px 0;
        }

        /* QUICK ADD BUTTON */
        .quick-add-btn {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #00ff00;
            border: none;
            border-radius: 50%;
            color: #000;
            font-size: 2em;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 0, 0.4);
            z-index: 50;
            transition: all 0.3s ease;
        }

        .quick-add-btn:active {
            transform: scale(0.9);
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            background: #0a0a0a;
            border-top: 1px solid rgba(0, 255, 0, 0.2);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
            flex-shrink: 0;
            border-radius: 0 0 24px 24px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #666;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 60px;
            padding: 8px 4px;
            border-radius: 8px;
            min-height: 60px;
            justify-content: center;
        }

        .nav-item.active {
            color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        .nav-item .nav-icon {
            font-size: 1.4em;
        }

        .nav-item:active {
            transform: scale(0.9);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #0a0a0a;
            border: 2px solid #00ff00;
            border-radius: 16px;
            padding: 25px;
            max-width: 350px;
            width: 90%;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 1.3em;
            font-weight: bold;
            color: #00ff00;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-food-name {
            font-size: 1.1em;
            margin-bottom: 15px;
            text-align: center;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .quantity-btn {
            width: 40px;
            height: 40px;
            background-color: #00ff00;
            border: none;
            border-radius: 50%;
            color: #000;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
        }

        .quantity-display {
            font-size: 2em;
            font-weight: bold;
            color: #00ff00;
            min-width: 60px;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-btn-confirm {
            background-color: #00ff00;
            color: #000;
        }

        .modal-btn-cancel {
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid rgba(0, 255, 0, 0.3);
        }

        /* LOADING OVERLAY */
        #loadingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            border-radius: 24px;
        }

        #loadingOverlay .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top-color: #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        #loadingOverlay .loading-text {
            color: #00ff00;
            font-size: 14px;
            text-align: center;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* SCROLLBAR */
        .nav-menu::-webkit-scrollbar,
        .content::-webkit-scrollbar,
        .main-content::-webkit-scrollbar {
            width: 3px;
        }

        .nav-menu::-webkit-scrollbar-track,
        .content::-webkit-scrollbar-track,
        .main-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .nav-menu::-webkit-scrollbar-thumb,
        .content::-webkit-scrollbar-thumb,
        .main-content::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 3px;
        }

        /* MOBILE OPTIMIZATIONS */
        @media (max-width: 428px) {
            .mobile-container {
                border-radius: 0;
                border: none;
                max-width: 100%;
                max-height: 100%;
            }
            
            .side-nav {
                border-radius: 0;
            }
            
            .overlay {
                border-radius: 0;
            }
            
            .bottom-nav {
                border-radius: 0;
            }
            
            .quick-add-btn {
                bottom: 90px;
                right: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- MOBILE CONTAINER -->
    <div class="mobile-container" id="mobileContainer">
        <!-- SIDE NAVIGATION -->
        <div class="side-nav" id="sideNav">
            <div class="nav-header">
                <h2>FITCARE</h2>
                <button class="close-nav" id="closeNav">✕</button>
            </div>

            <div class="nav-profile">
                <div class="profile-info">
                    <div class="profile-pic" id="profileInitial">U</div>
                    <div class="profile-text">
                        <h3 id="sidebarUserName">User</h3>
                        <p id="sidebarUserEmail">user@example.com</p>
                    </div>
                </div>
            </div>

            <div class="nav-menu">
                <a href="home.html" class="nav-item-side">
                    <span class="nav-icon-side">🏠</span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="analytics.html" class="nav-item-side">
                    <span class="nav-icon-side">📊</span>
                    <span class="nav-label">Analytics</span>
                </a>
                <a href="#" class="nav-item-side active">
                    <span class="nav-icon-side">🍽️</span>
                    <span class="nav-label">Meal Plans</span>
                </a>
                <a href="workouts.html" class="nav-item-side">
                    <span class="nav-icon-side">💪</span>
                    <span class="nav-label">Workouts</span>
                </a>
                <a href="weight.html" class="nav-item-side">
                    <span class="nav-icon-side">⚖️</span>
                    <span class="nav-label">Weight</span>
                </a>
                <a href="goals.html" class="nav-item-side">
                    <span class="nav-icon-side">🎯</span>
                    <span class="nav-label">Goals</span>
                </a>
                <a href="progress.html" class="nav-item-side">
                    <span class="nav-icon-side">📈</span>
                    <span class="nav-label">Progress</span>
                </a>
                <a href="shop.html" class="nav-item-side">
                    <span class="nav-icon-side">⚙️</span>
                    <span class="nav-label">Store</span>

                <a href="help.html" class="nav-item-side">
                    <span class="nav-icon-side">ℹ️</span>
                    <span class="nav-label">Help</span>

            <div class="nav-footer">
                <button class="logout-btn" onclick="logout()">
                    <span>🚪</span>
                    <span>Logout</span>
                </button>
            </div>
        </div>

        <!-- OVERLAY -->
        <div class="overlay" id="overlay"></div>

        <!-- SWIPE INDICATOR -->
        <div class="swipe-indicator" id="swipeIndicator"></div>

        <!-- LOADING OVERLAY -->
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text">Loading...</div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- STATUS BAR -->
            <div class="status-bar">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <div class="time" id="currentTime">9:41</div>
                <div class="status-icons">
                    <span>📶</span>
                    <span>🔋</span>
                </div>
            </div>

            <!-- HEADER -->
            <div class="header">
                <button class="back-btn" onclick="window.location.href='home.html'">←</button>
                <h1>Log Food</h1>
            </div>

            <!-- CONTENT -->
            <div class="content">
                <!-- SEARCH SECTION -->
                <div class="search-section">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" class="search-input" id="searchInput" placeholder="Search for food...">
                        <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
                    </div>
                </div>

                <!-- MEAL TYPE SELECTOR -->
                <div class="meal-selector">
                    <button class="meal-btn active" data-meal="breakfast">Breakfast</button>
                    <button class="meal-btn" data-meal="lunch">Lunch</button>
                    <button class="meal-btn" data-meal="dinner">Dinner</button>
                    <button class="meal-btn" data-meal="snacks">Snacks</button>
                </div>

                <!-- TODAY'S LOG -->
                <div class="todays-log">
                    <div class="log-header">
                        <div class="log-title">Today's Log</div>
                        <div class="total-calories"><span id="totalCalories">0</span> kcal</div>
                    </div>
                    <div id="loggedItems">
                        <div class="empty-log">No food logged yet. Start adding!</div>
                    </div>

                <!-- FOOD LIST -->
                <div class="food-list">
                    <div class="section-title">Suggested Foods</div>
                    <div id="foodItems"></div>
                </div>
            </div>
        </div>

        <!-- QUICK ADD BUTTON -->
        <button class="quick-add-btn" onclick="openQuickAdd()">+</button>

        <!-- BOTTOM NAVIGATION -->
        <div class="bottom-nav">
            <div class="nav-item" onclick="navigateTo('home')">
                <span class="nav-icon">🏠</span>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="navigateTo('stats')">
                <span class="nav-icon">📊</span>
                <span>Progress</span>
            </div>
            <div class="nav-item active" onclick="navigateTo('meals')">
                <span class="nav-icon">🍽️</span>
                <span>Meals</span>
            </div>
            <div class="nav-item" onclick="navigateTo('profile')">
                <span class="nav-icon">👤</span>
                <span>Profile</span>
            </div>
        </div>
    </div>

    <!-- ADD FOOD MODAL -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">Add Food</div>
            <div class="modal-food-name" id="modalFoodName"></div>
            <div class="quantity-selector">
                <button class="quantity-btn" onclick="changeQuantity(-1)">-</button>
                <div class="quantity-display" id="quantityDisplay">1</div>
                <button class="quantity-btn" onclick="changeQuantity(1)">+</button>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn modal-btn-confirm" onclick="confirmAdd()">Add</button>
            </div>
        </div>
    </div>

    <script>
        // Navigation variables
        let touchStartX = 0;
        let touchEndX = 0;
        let sidebarOpen = false;

        // Sidebar functions
        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].clientX;
            
            if (touchStartX < 50 && !sidebarOpen) {
                showSwipeIndicator();
            }
        }

        function handleTouchMove(e) {
            if (touchStartX < 30 && !sidebarOpen) {
                e.preventDefault();
            }
        }

        function handleTouchEnd(e) {
            touchEndX = e.changedTouches[0].clientX;
            const swipeDistance = touchEndX - touchStartX;
            
            hideSwipeIndicator();
            
            if (touchStartX < 50 && swipeDistance > 80) {
                toggleSidebar();
                simulateHaptic();
                return;
            }
            
            if (sidebarOpen && touchStartX - touchEndX > 80) {
                closeSidebar();
                simulateHaptic();
                return;
            }
        }

        function showSwipeIndicator() {
            const indicator = document.getElementById('swipeIndicator');
            indicator.style.transform = 'translateY(-50%) scale(1.2)';
            indicator.classList.add('visible');
        }

        function hideSwipeIndicator() {
            const indicator = document.getElementById('swipeIndicator');
            indicator.style.transform = 'translateY(-50%) scale(1)';
            indicator.classList.remove('visible');
        }

        function toggleSidebar() {
            const sideNav = document.getElementById('sideNav');
            const overlay = document.getElementById('overlay');
            const mainContent = document.querySelector('.main-content');
            
            if (!sidebarOpen) {
                sideNav.classList.add('open');
                overlay.classList.add('active');
                mainContent.style.overflow = 'hidden';
                document.addEventListener('touchstart', handleOverlayTouch, { passive: true });
            } else {
                sideNav.classList.remove('open');
                overlay.classList.remove('active');
                mainContent.style.overflow = '';
                document.removeEventListener('touchstart', handleOverlayTouch);
            }
            
            sidebarOpen = !sidebarOpen;
            simulateHaptic();
        }

        function closeSidebar() {
            const sideNav = document.getElementById('sideNav');
            const overlay = document.getElementById('overlay');
            const mainContent = document.querySelector('.main-content');
            
            sideNav.classList.remove('open');
            overlay.classList.remove('active');
            mainContent.style.overflow = '';
            sidebarOpen = false;
            
            document.removeEventListener('touchstart', handleOverlayTouch);
            simulateHaptic();
        }

        function handleOverlayTouch(e) {
            if (sidebarOpen && !e.target.closest('.side-nav')) {
                closeSidebar();
            }
        }

        function simulateHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        }

        function showLoading(message) {
            const loader = document.getElementById('loadingOverlay');
            if (loader) {
                const text = loader.querySelector('.loading-text');
                if (text) text.textContent = message || 'Loading...';
                loader.style.display = 'flex';
            }
        }

        function hideLoading() {
            const loader = document.getElementById('loadingOverlay');
            if (loader) {
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 300);
            }
        }

        // Bottom Navigation Functions
        function navigateTo(page) {
            simulateHaptic();
            
            // Update active state
            const navItems = document.querySelectorAll('.bottom-nav .nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            showLoading(`Loading ${page}...`);
            
            setTimeout(() => {
                hideLoading();
                
                // Navigate to the actual page
                if (page === 'home') {
                    window.location.href = 'home.html';
                } else if (page === 'stats') {
                    window.location.href = 'progress.html';
                } else if (page === 'meals') {
                    // Already on meals page
                } else if (page === 'profile') {
                    window.location.href = 'profile.html';
                }
            }, 300);
        }

        // Food logging variables
        var currentMeal = 'breakfast';
        var currentQuantity = 1;
        var selectedFood = null;
        var loggedFoods = [];

        var foodDatabase = [
            { name: 'Brown Rice', calories: 215, protein: 5, carbs: 45, serving: '1 cup' },
            { name: 'Chicken', calories: 165, protein: 31, carbs: 0, serving: '100g' },
            { name: 'Banana', calories: 105, protein: 1, carbs: 27, serving: '1 medium' },
            { name: 'Oatmeal', calories: 150, protein: 5, carbs: 27, serving: '1/2 cup' },
            { name: 'Eggs', calories: 70, protein: 6, carbs: 1, serving: '1 large' },
            { name: 'Yogurt', calories: 100, protein: 17, carbs: 6, serving: '170g' },
            { name: 'Almonds', calories: 160, protein: 6, carbs: 6, serving: '28g' },
            { name: 'Apple', calories: 95, protein: 0, carbs: 25, serving: '1 medium' },
            { name: 'Fish', calories: 206, protein: 22, carbs: 0, serving: '100g' },
            { name: 'Sweet Potato', calories: 112, protein: 2, carbs: 26, serving: '1 medium' }
        ];

        function init() {
            // Load user data
            loadUserData();
            
            // Setup navigation
            setupNavigation();
            
            // Setup food logging
            updateTime();
            setInterval(updateTime, 1000);
            displayFoodItems(foodDatabase);
            setupSearchListener();
            setupMealButtons();
            updateTotalCalories();
        }

        function loadUserData() {
            const storedData = localStorage.getItem('fitcareUserData');
            
            if (storedData) {
                try {
                    const data = JSON.parse(storedData);
                    document.getElementById('sidebarUserName').textContent = data.name || "User";
                    document.getElementById('sidebarUserEmail').textContent = data.email || "user@example.com";
                    document.getElementById('profileInitial').textContent = (data.name || "User").charAt(0).toUpperCase();
                } catch (error) {
                    console.error('Error parsing user data:', error);
                }
            }
        }

        function setupNavigation() {
            // Set up event listeners
            const mobileContainer = document.getElementById('mobileContainer');
            mobileContainer.addEventListener('touchstart', handleTouchStart, { passive: true });
            mobileContainer.addEventListener('touchmove', handleTouchMove, { passive: false });
            mobileContainer.addEventListener('touchend', handleTouchEnd, { passive: true });
            
            // Sidebar controls
            document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
            document.getElementById('closeNav').addEventListener('click', closeSidebar);
            document.getElementById('overlay').addEventListener('click', closeSidebar);
            
            // Highlight active nav items
            highlightActiveNav();
            
            // Set up bottom nav click handlers
            const bottomNavItems = document.querySelectorAll('.bottom-nav .nav-item');
            bottomNavItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    // Get page from the onclick attribute or text content
                    const page = this.getAttribute('onclick')?.match(/'([^']+)'/)?.[1] || 
                                 this.querySelector('span:nth-child(2)').textContent.toLowerCase();
                    navigateTo(page);
                });
            });
        }

        function highlightActiveNav() {
            // Highlight bottom nav
            const bottomNavItems = document.querySelectorAll('.bottom-nav .nav-item');
            bottomNavItems.forEach(item => {
                if (item.classList.contains('active')) {
                    item.classList.remove('active');
                }
                if (item.textContent.trim().toLowerCase().includes('meals')) {
                    item.classList.add('active');
                }
            });
            
            // Highlight side nav
            const sideNavItems = document.querySelectorAll('.nav-item-side');
            sideNavItems.forEach(item => {
                if (item.classList.contains('active')) {
                    item.classList.remove('active');
                }
                if (item.textContent.trim().toLowerCase().includes('meal plans')) {
                    item.classList.add('active');
                }
            });
        }

        function updateTime() {
            var now = new Date();
            var hours = now.getHours().toString().padStart(2, '0');
            var minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('currentTime').textContent = hours + ':' + minutes;
        }

        function setupSearchListener() {
            var searchInput = document.getElementById('searchInput');
            var clearBtn = document.getElementById('clearBtn');

            searchInput.addEventListener('input', function() {
                var searchTerm = this.value.toLowerCase();
                if (searchTerm) {
                    clearBtn.classList.add('visible');
                    var filtered = foodDatabase.filter(function(food) {
                        return food.name.toLowerCase().indexOf(searchTerm) !== -1;
                    });
                    displayFoodItems(filtered);
                } else {
                    clearBtn.classList.remove('visible');
                    displayFoodItems(foodDatabase);
                }
            });
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearBtn').classList.remove('visible');
            displayFoodItems(foodDatabase);
        }

        function setupMealButtons() {
            var buttons = document.querySelectorAll('.meal-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].addEventListener('click', function() {
                    var allBtns = document.querySelectorAll('.meal-btn');
                    for (var j = 0; j < allBtns.length; j++) {
                        allBtns[j].classList.remove('active');
                    }
                    this.classList.add('active');
                    currentMeal = this.getAttribute('data-meal');
                });
            }
        }

        function displayFoodItems(foods) {
            var container = document.getElementById('foodItems');
            container.innerHTML = '';

            for (var i = 0; i < foods.length; i++) {
                var food = foods[i];
                var item = document.createElement('div');
                item.className = 'food-item';
                item.innerHTML = 
                    '<div class="food-info">' +
                        '<div class="food-name">' + food.name + '</div>' +
                        '<div class="food-nutrients">' +
                            '<span class="nutrient">🔥 ' + food.calories + ' cal</span>' +
                            '<span class="nutrient">💪 ' + food.protein + 'g</span>' +
                            '<span class="nutrient">🍞 ' + food.carbs + 'g</span>' +
                        '</div>' +
                    '</div>' +
                    '<button class="add-btn" onclick="openModal(' + i + ')">+</button>';
                container.appendChild(item);
            }
        }

        function openModal(index) {
            selectedFood = foodDatabase[index];
            currentQuantity = 1;
            document.getElementById('modalFoodName').textContent = selectedFood.name + ' (' + selectedFood.serving + ')';
            document.getElementById('quantityDisplay').textContent = currentQuantity;
            document.getElementById('addModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('addModal').classList.remove('active');
        }

        function changeQuantity(change) {
            currentQuantity = Math.max(1, currentQuantity + change);
            document.getElementById('quantityDisplay').textContent = currentQuantity;
        }

        function confirmAdd() {
            if (selectedFood) {
                var loggedItem = {
                    name: selectedFood.name,
                    calories: selectedFood.calories * currentQuantity,
                    protein: selectedFood.protein * currentQuantity,
                    carbs: selectedFood.carbs * currentQuantity,
                    quantity: currentQuantity,
                    meal: currentMeal,
                    date: getCurrentDateString(),
                    serving: selectedFood.serving
                };
                
                loggedFoods.push(loggedItem);
                updateLoggedItems();
                updateTotalCalories();
                
                // Save to localStorage so progress tracker can access it
                saveFoodLogsToStorage();
                
                closeModal();
            }
        }

        function getCurrentDateString() {
            var today = new Date();
            return today.toISOString().split('T')[0];
        }

        function saveFoodLogsToStorage() {
    // Get existing logs from localStorage
    var allLogs = JSON.parse(localStorage.getItem('fitcareFoodLogs') || '{}');
    
    // Get today's date
    var today = getCurrentDateString();
    
    // Initialize today's logs array if it doesn't exist
    if (!allLogs[today]) {
        allLogs[today] = [];
    }
    
    // Add all logged foods for today
    allLogs[today] = loggedFoods;
    
    // Save back to localStorage
    localStorage.setItem('fitcareFoodLogs', JSON.stringify(allLogs));
    
    // Also update total calories for today
    updateDailyCaloriesInStorage();
    
    // DEBUG: Show what's being saved
    console.log('Food logs saved:', {
        date: today,
        foods: loggedFoods,
        totalCalories: loggedFoods.reduce((sum, food) => sum + food.calories, 0)
    });
}
        function updateDailyCaloriesInStorage() {
            var dailyCalories = JSON.parse(localStorage.getItem('fitcareDailyCalories') || '{}');
            var today = getCurrentDateString();
            
            // Calculate total calories from logged foods
            var totalCalories = 0;
            loggedFoods.forEach(function(food) {
                totalCalories += food.calories;
            });
            
            dailyCalories[today] = totalCalories;
            localStorage.setItem('fitcareDailyCalories', JSON.stringify(dailyCalories));
        }

        function updateLoggedItems() {
            var container = document.getElementById('loggedItems');
            if (loggedFoods.length === 0) {
                container.innerHTML = '<div class="empty-log">No food logged yet. Start adding!</div>';
                return;
            }

            container.innerHTML = '';
            for (var i = 0; i < loggedFoods.length; i++) {
                var item = loggedFoods[i];
                var logged = document.createElement('div');
                logged.className = 'logged-item';
                logged.innerHTML =
                    '<div class="logged-info">' +
                        '<div class="logged-name">' + item.name + ' (x' + item.quantity + ')</div>' +
                        '<div class="logged-meal">' + item.meal.charAt(0).toUpperCase() + item.meal.slice(1) + '</div>' +
                        '<div class="logged-nutrients">' +
                            '<span>🔥 ' + item.calories + ' cal</span>' +
                            '<span>💪 ' + item.protein + 'g</span>' +
                            '<span>🍞 ' + item.carbs + 'g</span>' +
                        '</div>' +
                    '</div>' +
                    '<button class="remove-btn" onclick="removeItem(' + i + ')">🗑️</button>';
                container.appendChild(logged);
            }
        }

        function removeItem(index) {
            loggedFoods.splice(index, 1);
            updateLoggedItems();
            updateTotalCalories();
            saveFoodLogsToStorage();
        }

        function updateTotalCalories() {
            var total = 0;
            for (var i = 0; i < loggedFoods.length; i++) {
                total += loggedFoods[i].calories;
            }
            document.getElementById('totalCalories').textContent = total;
        }

        function openQuickAdd() {
            alert('Quick add feature - you can add custom food here!');
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                showLoading('Logging out...');
                
                setTimeout(() => {
                    localStorage.removeItem('fitcareUserData');
                    hideLoading();
                    alert('Successfully logged out!');
                    window.location.href = 'login3.html';
                }, 1000);
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);

        // Prevent zoom on double tap
        document.addEventListener('dblclick', (e) => {
            e.preventDefault();
        }, { passive: false });

        // Prevent context menu on long press
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
